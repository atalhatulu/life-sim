name: Node tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run genealogy -- uyuk-1600 4
      - run: npm run book -- uyuk-1600 1
      - run: npm run notebook -- uyuk-1600 1
      - run: npm run village -- uyuk-1600 1
      - run: npm run uyuk -- init artifacts/canonical/uyuk-1600.world.json
      - run: npm run uyuk -- verify artifacts/canonical/uyuk-1600.world.json
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-uyuk-1600
          path: artifacts/canonical/uyuk-1600.world.json
      - run: npm run census -- seed uyuk-1600
