<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Sim | Üyük</title>
<style>
:root{color-scheme:dark;--bg:#141913;--panel:#20291e;--line:#40503a;--gold:#dfbf80;--text:#f4ead7;--muted:#b4bba9;--green:#93b77d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px Georgia,serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.app{display:grid;grid-template-columns:230px minmax(320px,1fr) 270px;min-height:100vh}aside{padding:23px;background:var(--panel)}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}h1,h2,h3,p{margin:0 0 12px}h1,h2{color:var(--gold)}h1{font-size:30px}.muted{color:var(--muted);font-size:13px}.divider{border-top:1px solid var(--line);margin:22px 0}.villager,.option{width:100%;text-align:left;border:1px solid var(--line);border-radius:7px;background:#303b2d;color:var(--text);padding:12px;margin:5px 0}.villager.active,.villager:hover,.option:hover{border-color:var(--gold);background:#3b4935}.villager small{display:block;color:var(--muted);margin-top:5px}.center{display:flex;flex-direction:column;min-height:720px}.top{display:flex;justify-content:space-between;gap:12px;padding:20px;border-bottom:1px solid var(--line);color:var(--gold)}.scene{flex:1;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at center,#344630 0%,#1a241b 70%,#141913 100%);padding:28px}.symbol{font-size:68px;margin:0 0 10px}.scene h2{font-size:34px}.dialogue{padding:22px;border-top:1px solid var(--line)}.speech{background:#2a3527;border-left:3px solid var(--gold);padding:18px;min-height:76px;line-height:1.6}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.option{margin:0}.stat{display:flex;justify-content:space-between;gap:12px;margin:13px 0}.stat strong{text-align:right}.bar{background:#10170f;height:8px;border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--green);transition:width .2s}.history p{padding:8px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.45}@media(max-width:900px){.app{grid-template-columns:190px 1fr}.right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}@media(max-width:600px){.app{display:block}.left{border-right:0}.center{min-height:620px}.options{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="left"><h1>Üyük</h1><p class="muted">1 Ocak 1600 · Sabah</p><div class="divider"></div><h3>Köy halkı</h3><div id="villagers"></div><div class="divider"></div><p class="muted">Life Sim · Etkileşimli UI prototipi. Karakterler örnek veridir.</p></aside>
<main class="center"><header class="top"><span>Üyük Köy Meydanı</span><time id="clock">08:00</time></header><section class="scene"><div><div class="symbol" id="avatar" aria-hidden="true">⚒</div><h2 id="characterName"></h2><p class="muted" id="sceneInfo"></p></div></section><section class="dialogue"><h3 id="speaker"></h3><div class="speech" id="speech" aria-live="polite"></div><div class="options" id="options"></div></section></main>
<aside class="right"><h2>Karakter bilgileri</h2><div id="profile"></div><div class="divider"></div><h3>İlişki</h3><div class="stat"><span>Güven</span><strong id="trustValue"></strong></div><div class="bar"><div class="fill" id="trustBar"></div></div><div class="divider"></div><h3>Konuşma geçmişi</h3><div id="history" class="history"></div></aside>
</div>
<script>
"use strict";
// Standalone UI fixture: not yet connected to the canonical world or dialogue engine.
const villagers=[
{id:1,name:"Hasan Demirci",age:58,job:"Demirci",mood:"Sakin",personality:"Sabırlı, çalışkan",location:"Demirci atölyesi",family:"Evli, üç çocuk",icon:"⚒",trust:50,memories:[],greeting:"Hoş geldin. Demir her zaman iş çıkarır."},
{id:2,name:"Mehmet Çiftçi",age:42,job:"Çiftçi",mood:"Yorgun",personality:"Çalışkan, konuşkan",location:"Köy meydanı",family:"Evli, iki çocuk",icon:"🌾",trust:45,memories:[],greeting:"Selam! Tarladan yeni döndüm."},
{id:3,name:"Ayşe Karaca",age:35,job:"Dokumacı",mood:"Neşeli",personality:"Meraklı, yardımsever",location:"Ev",family:"Evli, bir çocuk",icon:"🧵",trust:55,memories:[],greeting:"Hoş geldin! Buyur, ne konuşalım?"}
];
const options=[["Selam, nasılsın?","greet"],["İşlerin nasıl gidiyor?","work"],["Köyde neler oluyor?","news"],["Bana yardım edebilir misin?","help"],["Senin hakkında konuşalım.","personal"],["Görüşürüz.","leave"]];
let current=villagers[0],elapsedMinutes=0;
const byId=id=>document.getElementById(id);
function element(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node}
function renderVillagers(){const list=byId("villagers");list.replaceChildren();for(const v of villagers){const button=element("button",v.name,"villager"+(v.id===current.id?" active":""));button.type="button";button.append(element("small",v.job+" · "+v.mood));button.addEventListener("click",()=>selectVillager(v.id));list.append(button)}}
function renderProfile(){const profile=byId("profile");profile.replaceChildren();for(const [label,value] of [["Yaş",current.age],["Meslek",current.job],["Ruh hâli",current.mood],["Kişilik",current.personality],["Aile",current.family],["Konum",current.location]]){const row=element("div",undefined,"stat");row.append(element("span",label),element("strong",String(value)));profile.append(row)}byId("trustValue").textContent=current.trust+"/100";byId("trustBar").style.width=current.trust+"%";const history=byId("history");history.replaceChildren();const recent=current.memories.slice(-5).reverse();for(const note of recent)history.append(element("p",note));if(!recent.length)history.append(element("p","Henüz konuşma kaydı yok."))}
function renderOptions(){const area=byId("options");area.replaceChildren();for(const [label,action] of options){const button=element("button",label,"option");button.type="button";button.addEventListener("click",()=>talk(action));area.append(button)}}
function selectVillager(id){current=villagers.find(v=>v.id===id);byId("avatar").textContent=current.icon;byId("characterName").textContent=current.name;byId("sceneInfo").textContent=current.location+" · "+current.mood;byId("speaker").textContent=current.name;byId("speech").textContent=current.greeting;renderVillagers();renderProfile();renderOptions()}
function talk(action){let response="";switch(action){case "greet":response=current.trust>=70?"Seni görmek güzel! Gel, biraz oturalım.":"İyiyim, sağ ol. Sen nasılsın?";current.trust+=2;break;case "work":response=current.job==="Demirci"?"Bugün iki saban tamir edeceğim. İşler birikiyor.":current.job==="Çiftçi"?"Toprağın yağmura ihtiyacı var. Hasadı düşünüyorum.":"Dokuma işleriyle uğraşıyorum. Daha bitirecek çok şey var.";break;case "news":response="Köyde herkes yaklaşan hasattan söz ediyor.";break;case "help":if(current.trust>=65){response="Elimden geleni yaparım. Neye ihtiyacın var?";current.trust+=3}else response="Şimdi kendi işlerim var. Belki başka zaman.";break;case "personal":if(current.trust>=60){response="Ailem benim için önemli. Çocuklarımın geleceğini düşünüyorum.";current.trust+=2}else response="Önce biraz daha tanışalım, sonra konuşuruz.";break;case "leave":response="Yolun açık olsun. Yine görüşürüz.";break;default:return}current.trust=Math.min(100,Math.max(0,current.trust));current.memories.push(options.find(item=>item[1]===action)[0]+" — "+response);elapsedMinutes+=5;const total=8*60+elapsedMinutes;byId("clock").textContent=String(Math.floor(total/60)%24).padStart(2,"0")+":"+String(total%60).padStart(2,"0");byId("speech").textContent=response;renderProfile()}
selectVillager(1);
</script>
</body></html>
